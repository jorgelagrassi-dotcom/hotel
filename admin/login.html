<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuiaComercial - Login</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<div class="login-box">

    <h1>GuiaComercial</h1>

    <h3>Painel Administrativo</h3>

    <input
        type="email"
        id="email"
        placeholder="E-mail">

    <input
        type="password"
        id="senha"
        placeholder="Senha">

    <button id="btnEntrar">
        Entrar
    </button>

    <p id="mensagem"></p>

</div>

<script type="module" src="../js/auth.js"></script>

</body>
</html>
